
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Recommender Discount Price Overlay - CSV/TSV to JSON Converter</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 20px auto;
            padding: 20px;
        }
        textarea {
            width: 100%;
            height: 200px;
            margin: 10px 0;
            padding: 10px;
            box-sizing: border-box;
        }
        button {
            padding: 10px 20px;
            margin: 5px;
            cursor: pointer;
        }
        #output {
            white-space: pre-wrap;
            background: #f5f5f5;
            padding: 10px;
            border: 1px solid #ddd;
            min-height: 100px;
        }
        pre {
            background: #f4f4f4;
            padding: 10px;
            max-height: 50vh;
            overflow-x: auto;
            overflow-y: auto;
        }
    </style>
</head>
<body>
    <h1>CSV/TSV to JSON Converter</h1>
    <p>Paste your CSV or TSV data below (e.g., "SKU,DiscountPrice,Message,activationStart,activationEnd"):</p>
    <textarea id="input" placeholder="SKU,DiscountPrice,Message,activationStart,activationEnd
SKU1,\"1,111\",\"Extra message 1\",\"2026-01-01T00:00:00+08:00\",\"2026-12-31T23:59:59+08:00\"
SKU2,\"2,222\",\"Extra message 2\",\"2026-01-01T00:00:00+08:00\",\"2026-12-31T23:59:59+08:00\""></textarea>
    
    <button onclick="convertToJson()">Convert to JSON</button>
    <button onclick="copyToClipboard('output')" id="copyBtn" disabled>Copy to Clipboard</button>
    <button onclick="downloadJson()" id="downloadBtn" disabled>Download JSON</button>
    
    <h2>Output</h2>
    <div id="output"></div>

    <h2>Script</h2>
    <div class="button-group">
        <button onclick="copyToClipboard('jsInsert')">Copy to Clipboard</button>
    </div>


    <pre id="jsInsert"><code>
    </code></pre>


    <script>
        function convertToJson() {
            const input = document.getElementById('input').value.trim();
            if (!input) {
                alert('Please paste some CSV/TSV data first!');
                return;
            }

            // Detect delimiter (comma for CSV, tab for TSV)
            const lines = input.split('\n');
            const firstLine = lines[0];
            const delimiter = firstLine.includes('\t') ? '\t' : ',';

            // Parse the input
            const headers = firstLine.split(delimiter).map(h => h.trim());
            const replacements = [];

            for (let i = 1; i < lines.length; i++) {
                if (lines[i].trim() === '') continue; // Skip empty lines
                const values = lines[i].split(delimiter).map(v => v.replace(/^"(.*)"$/, '$1').trim());
                if (values.length === headers.length) {
                    replacements.push({
                        sku: values[0],
                        discountPrice: values[1],
                        message: values[2],
                        activationStart: values[3],
                        activationEnd: values[4]
                    });
                }
            }

            // Construct JSON config
            const jsonConfig = {
                replacements: replacements,
                urlPattern: "/hk/",
                delay: 4000,
                currency: "HK$",
                messageStyle: "bundle-message"
            };

            // Display JSON
            const output = JSON.stringify(jsonConfig, null, 4);
            document.getElementById('output').textContent = output;

            // Enable buttons
            document.getElementById('copyBtn').disabled = false;
            document.getElementById('downloadBtn').disabled = false;
        }

        function copyToClipboard(elementId) {
            const element = document.getElementById(elementId);
            if (!element) {
                alert('Element not found!');
                return;
            }

            const textToCopy = element.textContent;
            if (!textToCopy) {
                alert('No content to copy!');
                return;
            }

            navigator.clipboard.writeText(textToCopy).then(() => {
                alert('Content copied to clipboard!');
            }).catch(err => {
                alert('Failed to copy: ' + err);
            });
        }

        function downloadJson() {
            const output = document.getElementById('output').textContent;
            if (!output) return;

            const blob = new Blob([output], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'priceConfig.json';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }
    </script>
</body>
</html>
