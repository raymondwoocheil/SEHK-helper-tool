<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>TSV Premium SKU Comparator</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #f5f5f5;
        }
        .container {
            max-width: 1000px;
            width: 100%;
            padding: 20px;
            box-sizing: border-box;
        }
        h2 {
            text-align: center;
            margin-bottom: 20px;
        }
        .input-section {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
        }
        .input-wrapper {
            width: 50%;
        }
        textarea {
            width: 100%;
            height: 200px;
            resize: vertical;
            box-sizing: border-box;
            padding: 10px;
        }
        .button-wrapper {
            text-align: center;
            margin-bottom: 20px;
        }
        button {
            padding: 10px 20px;
            cursor: pointer;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 4px;
        }
        button:hover {
            background-color: #45a049;
        }
        #results {
            margin-top: 20px;
        }
        table {
            border-collapse: collapse;
            width: 100%;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: left;
        }
        th {
            background-color: #f2f2f2;
        }
        .passed {
            background-color: #e6ffe6;
        }
        .failed {
            background-color: #ffe6e6;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>TSV Premium SKU Comparator</h2>
        <div class="input-section">
            <div class="input-wrapper">
                <label for="tsvA">Client brief:</label><br>
                <textarea id="tsvA" placeholder="Paste Client brief here..."></textarea>
            </div>
            <div class="input-wrapper">
                <label for="tsvB">Test case:</label><br>
                <textarea id="tsvB" placeholder="Paste Test case here..."></textarea>
            </div>
        </div>
        <div class="button-wrapper">
            <button onclick="compareTSVs()">Compare</button>
        </div>
        <div id="results"></div>
    </div>

    <script>
        function parseTSV(tsvText) {
            const lines = tsvText.trim().split('\n');
            const result = new Map();
            
            for (let i = 1; i < lines.length; i++) {
                const columns = lines[i].split('\t');
                const mainSKU = columns[0];
                const premiums = columns.slice(1).filter(val => val.trim() !== '');
                if (mainSKU) {
                    result.set(mainSKU, new Set(premiums));
                }
            }
            return result;
        }

        function compareTSVs() {
            const tsvA = document.getElementById('tsvA').value;
            const tsvB = document.getElementById('tsvB').value;
            const resultsDiv = document.getElementById('results');
            
            if (!tsvA || !tsvB) {
                resultsDiv.innerHTML = '<p class="failed">Please provide both inputs</p>';
                return;
            }

            const dataA = parseTSV(tsvA);
            const dataB = parseTSV(tsvB);
            const allSKUs = new Set([...dataA.keys(), ...dataB.keys()]);
            let rows = [];

            allSKUs.forEach(sku => {
                const premiumsA = dataA.get(sku) || new Set();
                const premiumsB = dataB.get(sku) || new Set();

                if (!dataA.has(sku)) {
                    rows.push({
                        sku: sku,
                        status: 'failed',
                        message: 'SKU appears in Test case but missing in Client brief'
                    });
                    return;
                }
                if (!dataB.has(sku)) {
                    rows.push({
                        sku: sku,
                        status: 'failed',
                        message: 'SKU appears in Client brief but missing in Test case'
                    });
                    return;
                }

                let hasDifferences = false;
                const differences = [];

                premiumsA.forEach(premium => {
                    if (!premiumsB.has(premium)) {
                        differences.push(`SKU has premium ${premium} in Client brief but missing in Test case`);
                        hasDifferences = true;
                    }
                });

                premiumsB.forEach(premium => {
                    if (!premiumsA.has(premium)) {
                        differences.push(`SKU has premium ${premium} in Test case but missing in Client brief`);
                        hasDifferences = true;
                    }
                });

                if (hasDifferences) {
                    differences.forEach(message => {
                        rows.push({
                            sku: sku,
                            status: 'failed',
                            message: message
                        });
                    });
                } else {
                    rows.push({
                        sku: sku,
                        status: 'passed',
                        message: 'SKU has identical premiums'
                    });
                }
            });

            let tableHTML = `
                <table>
                    <thead>
                        <tr>
                            <th>Main SKU</th>
                            <th>Status</th>
                            <th>Details</th>
                        </tr>
                    </thead>
                    <tbody>
            `;

            rows.forEach(row => {
                tableHTML += `
                    <tr class="${row.status}">
                        <td>${row.sku}</td>
                        <td>${row.status}</td>
                        <td>${row.message}</td>
                    </tr>
                `;
            });

            tableHTML += `
                    </tbody>
                </table>
            `;

            resultsDiv.innerHTML = tableHTML;
        }
    </script>
</body>
</html>
